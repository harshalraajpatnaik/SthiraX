<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield / Precast Hexagon Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Structural Grid / Precast Chamfer -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.4"/>

  <!-- The SthiraX Hexagonal Mineralization Nexus -->
  <g filter="url(#glow)">
    <!-- Top-Left to Bottom-Right Diagonal Arm (Solid Carbon Mineral Beam) -->
    <path d="M18 16 L27 16 L46 48 L37 48 Z" fill="url(#crystalGrad)"/>
    
    <!-- Top-Right to Bottom-Left Diagonal Arm (Active CO2 Infusion Ray) -->
    <path d="M46 16 L37 16 L18 48 L27 48 Z" fill="url(#emeraldGrad)"/>

    <!-- Central Sthira "S" Core Interlock -->
    <!-- Upper horizontal hook of S -->
    <path d="M22 20 C22 17 40 17 42 22 L35 25 C34 23 28 23 28 25 C28 28 42 27 42 35 C42 42 24 43 21 37 L28 34 C29 36 35 36 35 34 C35 31 22 32 22 20 Z" fill="#F8FAFC" opacity="0.95"/>

    <!-- Trapped Mineralized Molecule Gem (Central Ca++ / CO3-- Carbon Crystal) -->
    <circle cx="32" cy="32" r="4.5" fill="#FFFFFF"/>
    <circle cx="32" cy="32" r="3" fill="#10B981"/>
    <circle cx="33" cy="31" r="1" fill="#FFFFFF"/>
  </g>

  <!-- Accent Edge Highlight (Enduring Mineralized Finish) -->
  <circle cx="15" cy="15" r="2" fill="#10B981" opacity="0.8"/>
  <circle cx="49" cy="49" r="2" fill="#38BDF8" opacity="0.8"/>
</svg>
